<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Scratch Storage Diagnostic</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        pre { background: #f0f0f0; padding: 10px; overflow-x: auto; }
        .success { color: green; }
        .error { color: red; }
        .warning { color: orange; }
        #results { margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Scratch Storage Diagnostic</h1>
    <p>This page tests if the storage module is properly initialized.</p>
    <button id="runDiagnostic">Run Diagnostic</button>
    <div id="results"></div>

    <script>
        // HOOK: Intercept key functions BEFORE gui.js loads
        window.__DIAGNOSTIC__ = {
            logs: [],
            vm: null,
            storage: null,
            storageInitCalled: false,
            addOfficialScratchWebStoresCalled: false
        };

        // Log function that stores messages
        window.__DIAGNOSTIC__.addLog = function(msg) {
            var timestamp = new Date().toISOString();
            window.__DIAGNOSTIC__.logs.push('[' + timestamp + '] ' + msg);
            console.log('[DIAGNOSTIC] ' + msg);
        };

        window.__DIAGNOSTIC__.addLog('Diagnostic hooks initialized');

        // Intercept Object.defineProperty to catch module exports
        var originalDefineProperty = Object.defineProperty;
        Object.defineProperty = function(obj, prop, descriptor) {
            // Check if this looks like a storage module being defined
            if (descriptor && descriptor.value) {
                var val = descriptor.value;

                // Check for Storage class with addOfficialScratchWebStores
                if (typeof val === 'function' && val.prototype && val.prototype.addOfficialScratchWebStores) {
                    window.__DIAGNOSTIC__.addLog('Found Storage class definition!');

                    // Wrap addOfficialScratchWebStores
                    var original = val.prototype.addOfficialScratchWebStores;
                    val.prototype.addOfficialScratchWebStores = function() {
                        window.__DIAGNOSTIC__.addLog('addOfficialScratchWebStores() CALLED!');
                        window.__DIAGNOSTIC__.addOfficialScratchWebStoresCalled = true;
                        window.__DIAGNOSTIC__.storage = this;
                        try {
                            var result = original.apply(this, arguments);
                            window.__DIAGNOSTIC__.addLog('addOfficialScratchWebStores() completed successfully');
                            window.__DIAGNOSTIC__.addLog('webHelper.stores.length = ' + this.webHelper.stores.length);
                            return result;
                        } catch (e) {
                            window.__DIAGNOSTIC__.addLog('addOfficialScratchWebStores() ERROR: ' + e.message);
                            throw e;
                        }
                    };
                }

                // Check for VM class with attachStorage
                if (typeof val === 'function' && val.prototype && val.prototype.attachStorage && val.prototype.addSound) {
                    window.__DIAGNOSTIC__.addLog('Found VM class definition!');

                    // Wrap attachStorage
                    var originalAttach = val.prototype.attachStorage;
                    val.prototype.attachStorage = function(storage) {
                        window.__DIAGNOSTIC__.addLog('VM.attachStorage() CALLED!');
                        window.__DIAGNOSTIC__.vm = this;
                        window.__DIAGNOSTIC__.storage = storage;
                        return originalAttach.apply(this, arguments);
                    };
                }
            }

            return originalDefineProperty.call(this, obj, prop, descriptor);
        };

        // Also intercept addEventListener for DOMContentLoaded timing
        window.__DIAGNOSTIC__.addLog('Waiting for gui.js to load...');
    </script>
    <script defer src="gui.js"></script>
    <script>
        // Wait for gui.js to load and initialize
        window.addEventListener('load', function() {
            window.__DIAGNOSTIC__.addLog('Window load event fired');

            // Give React time to mount
            setTimeout(function() {
                window.__DIAGNOSTIC__.addLog('Setting up diagnostic button');
                document.getElementById('runDiagnostic').onclick = runDiagnostic;
            }, 2000);
        });

        function log(message, type) {
            var results = document.getElementById('results');
            var p = document.createElement('p');
            p.className = type || '';
            p.textContent = message;
            results.appendChild(p);
        }

        function runDiagnostic() {
            var results = document.getElementById('results');
            results.innerHTML = '<h2>Diagnostic Results:</h2>';

            log('Starting diagnostic at ' + new Date().toISOString());
            log('Current URL: ' + window.location.href);
            log('Protocol: ' + window.location.protocol);

            // Try to access the storage module through multiple methods
            try {
                var vm = null;
                var storage = null;

                // Method 1: Look for VM in window or global webpack exports
                log('=== Method 1: Checking webpack modules ===');
                if (typeof window.webpackJsonp !== 'undefined') {
                    log('Found webpackJsonp', 'success');
                }

                // Method 2: Find through React fiber traversal (deeper search)
                log('=== Method 2: React fiber traversal ===');
                var appElement = document.querySelector('[class*="gui_body-wrapper"]') ||
                                 document.querySelector('[class*="app"]') ||
                                 document.querySelector('#app') ||
                                 document.body.firstElementChild;

                if (appElement) {
                    log('Found app element: ' + appElement.className.substring(0, 50), 'success');

                    var keys = Object.keys(appElement);
                    var reactKey = keys.find(function(k) {
                        return k.startsWith('__reactFiber') || k.startsWith('__reactInternalInstance') || k.startsWith('__reactContainer');
                    });

                    if (reactKey) {
                        log('Found React key: ' + reactKey.substring(0, 40) + '...', 'success');

                        // Deep search for VM
                        var fiber = appElement[reactKey];
                        var visited = new Set();
                        var maxDepth = 100;

                        function deepSearch(obj, path, depth) {
                            if (!obj || depth > maxDepth || visited.has(obj)) return null;
                            if (typeof obj !== 'object') return null;

                            try { visited.add(obj); } catch(e) {}

                            // Check if this is a VM
                            if (obj.runtime && obj.editingTarget !== undefined && typeof obj.addSound === 'function') {
                                log('Found VM at path: ' + path, 'success');
                                return { type: 'vm', value: obj };
                            }

                            // Check if this has storage with webHelper
                            if (obj.webHelper && obj.AssetType) {
                                log('Found Storage at path: ' + path, 'success');
                                return { type: 'storage', value: obj };
                            }

                            // Check for Redux store
                            if (obj.getState && obj.dispatch && obj.subscribe) {
                                log('Found Redux store at path: ' + path, 'success');
                                return { type: 'store', value: obj };
                            }

                            // Search common React fiber properties
                            var propsToCheck = ['memoizedState', 'memoizedProps', 'stateNode', 'child', 'return', 'alternate'];
                            for (var i = 0; i < propsToCheck.length; i++) {
                                var prop = propsToCheck[i];
                                if (obj[prop]) {
                                    var result = deepSearch(obj[prop], path + '.' + prop, depth + 1);
                                    if (result) return result;
                                }
                            }

                            // Also check 'vm' and 'store' properties directly
                            if (obj.vm) {
                                var result = deepSearch(obj.vm, path + '.vm', depth + 1);
                                if (result) return result;
                            }
                            if (obj.store) {
                                var result = deepSearch(obj.store, path + '.store', depth + 1);
                                if (result) return result;
                            }

                            return null;
                        }

                        var found = deepSearch(fiber, 'fiber', 0);

                        if (found) {
                            if (found.type === 'vm') {
                                vm = found.value;
                            } else if (found.type === 'storage') {
                                storage = found.value;
                            } else if (found.type === 'store') {
                                var state = found.value.getState();
                                if (state && state.scratchGui && state.scratchGui.vm) {
                                    vm = state.scratchGui.vm;
                                    log('Got VM from Redux state', 'success');
                                }
                            }
                        }
                    }
                }

                // Method 3: Search all iframes
                log('=== Method 3: Checking iframes ===');
                var iframes = document.querySelectorAll('iframe');
                log('Found ' + iframes.length + ' iframes');

                // Method 4: Check window properties
                log('=== Method 4: Checking window properties ===');
                var windowProps = ['vm', 'VM', 'scratchVM', 'ScratchVM', 'storage', 'ScratchStorage'];
                windowProps.forEach(function(prop) {
                    if (window[prop]) {
                        log('Found window.' + prop, 'success');
                        if (prop.toLowerCase().indexOf('vm') >= 0) vm = window[prop];
                        if (prop.toLowerCase().indexOf('storage') >= 0) storage = window[prop];
                    }
                });

                // Now analyze what we found
                // Method 5: Check our diagnostic hooks
            log('=== Method 5: Diagnostic Hooks ===');
            var diag = window.__DIAGNOSTIC__;
            if (diag) {
                log('Hook logs collected: ' + diag.logs.length);
                diag.logs.forEach(function(l) {
                    log('  ' + l);
                });

                log('addOfficialScratchWebStoresCalled: ' + diag.addOfficialScratchWebStoresCalled,
                    diag.addOfficialScratchWebStoresCalled ? 'success' : 'error');

                if (diag.vm) {
                    log('Hooked VM found!', 'success');
                    vm = diag.vm;
                }
                if (diag.storage) {
                    log('Hooked Storage found!', 'success');
                    storage = diag.storage;
                }
            } else {
                log('Diagnostic hooks not found', 'warning');
            }

            log('=== Analysis ===');

                if (vm) {
                    log('VM found!', 'success');
                    log('VM.editingTarget: ' + (vm.editingTarget ? 'exists' : 'null'));

                    if (vm.runtime) {
                        log('VM.runtime exists', 'success');
                        storage = vm.runtime.storage;
                    } else {
                        log('VM.runtime is missing!', 'error');
                    }
                } else {
                    log('VM not found', 'error');
                }

                if (storage) {
                    log('Storage found!', 'success');
                    analyzeStorage(storage);
                } else {
                    log('Storage not found', 'error');
                    log('This is likely why sounds cannot be loaded!', 'error');
                }

            } catch (e) {
                log('Error during diagnostic: ' + e.message, 'error');
                log('Stack: ' + (e.stack || 'N/A'), 'error');
            }

            log('=== Diagnostic complete ===');
        }

        function analyzeStorage(storage) {
            log('--- Storage Analysis ---');

            // Check webHelper
            if (storage.webHelper) {
                log('storage.webHelper exists', 'success');

                var stores = storage.webHelper.stores;
                log('webHelper.stores.length = ' + stores.length, stores.length > 0 ? 'success' : 'error');

                if (stores.length > 0) {
                    stores.forEach(function(s, i) {
                        log('  Store ' + i + ': types = [' + s.types.join(', ') + ']');
                    });

                    var hasSoundStore = stores.some(function(s) {
                        return s.types.indexOf('Sound') >= 0;
                    });

                    if (hasSoundStore) {
                        log('Sound store IS registered', 'success');
                        testSoundLoad(storage);
                    } else {
                        log('Sound store NOT registered!', 'error');
                        log('>>> addOfficialScratchWebStores() was NOT called! <<<', 'error');
                    }
                } else {
                    log('No stores registered!', 'error');
                    log('>>> addOfficialScratchWebStores() was NOT called! <<<', 'error');
                }
            } else {
                log('storage.webHelper is missing!', 'error');
            }

            // Check assetHost
            log('storage.assetHost = ' + (storage.assetHost || 'NOT SET'), storage.assetHost ? 'success' : 'warning');

            // Check _helpers
            if (storage._helpers) {
                log('storage._helpers.length = ' + storage._helpers.length);
            }
        }

        function testSoundLoad(storage) {
            log('--- Testing Sound Load ---');
            log('Attempting to load: 83a9787d4cb6f3b7632b4ddfebf74367.wav (Meow sound)');

            storage.load(storage.AssetType.Sound, '83a9787d4cb6f3b7632b4ddfebf74367', 'wav')
                .then(function(asset) {
                    if (asset) {
                        log('Sound loaded successfully!', 'success');
                        log('Asset data size: ' + asset.data.length + ' bytes', 'success');
                    } else {
                        log('Sound load returned null', 'warning');
                    }
                })
                .catch(function(err) {
                    log('Sound load failed: ' + (err.message || JSON.stringify(err)), 'error');
                });
        }
    </script>
</body>
</html>
