modLoader="javafml"
loaderVersion="[47,)"
license="MIT"
issueTrackerURL="https://github.com/laughtale01/Scratch/issues"

[[mods]]
modId="minecraftedu"
# 版は build.gradle の version だけに書く（jar の名前とゲームの中の表示をそろえるため）
version="${file.jarVersion}"
displayName="MinecraftEdu Scratch Controller"
displayURL="https://github.com/laughtale01/Scratch"
credits="Based on concepts from takecx's Scratch-Minecraft integration"
authors="MinecraftEdu Team"
description='''
Scratch 3.0 から Minecraft を動かすための、教育用の MOD です。
Scratch のブロックで、ブロックを置く・テレポート・天気や時刻を変えるなどの命令を送れます（自分の PC の Scratch からだけ）。
縦向きのハーフブロック（縦スラブ）39 種類と、金ブロックの階段・ハーフブロックも追加します。
Educational MOD to control Minecraft from Scratch 3.0 on the same PC, with 39 vertical slabs and gold block stairs and slabs.
'''

[[dependencies.minecraftedu]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.minecraftedu]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.21)"
    ordering="NONE"
    side="BOTH"
